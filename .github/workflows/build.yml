# =============================================================================
# qEmby CI 构建 workflow（本地重建版）
#
# 前置条件（缺一不可，均为仓库外因素）：
#   1. 本仓库需包含 cmake/QEmbyPlatformDeps.cmake 与 cmake/QEmbyPackaging.cmake
#      （上游缺失，已本地重建，必须随本文件一起提交）
#   2. Windows: libmpv SDK 由 CI 从 shinchiro/mpv-winbuild-cmake releases 下载，
#      布局对齐 README 要求的 libs/libmpv/{bin,include,lib}
#   3. macOS: libmpv 用 brew 版（qEmbyApp/CMakeLists.txt 明确支持系统 libmpv）
# =============================================================================

name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # 创建/更新 Releases 必需
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          arch: win64_msvc2022_64
          modules: qtwebsockets
          cache: true

      # sccache: cross-build compiler cache backed by the GitHub Actions
      # cache service. Unchanged translation units are served from cache
      # instead of being recompiled, so incremental pushes only pay for
      # the files they touched + linking.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup libmpv SDK (shinchiro build)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p /tmp/mpv-main /tmp/mpv-dev libs/libmpv/bin libs/libmpv/lib
          # pattern 限定 '2*' 开头（日期 2026xx），排除 x86-64-v3 指令集变体包
          gh release download --repo shinchiro/mpv-winbuild-cmake \
            --pattern 'mpv-x86_64-2*.7z' --dir /tmp/mpv-main --clobber
          gh release download --repo shinchiro/mpv-winbuild-cmake \
            --pattern 'mpv-dev-x86_64-2*.7z' --dir /tmp/mpv-dev --clobber
          7z x -y /tmp/mpv-main/*.7z -o/tmp/mpv-main/x >/dev/null
          7z x -y /tmp/mpv-dev/*.7z -o/tmp/mpv-dev/x >/dev/null
          # 用 find 定位实际位置（不依赖包内目录布局假设）
          MPV_DLL="$(find /tmp/mpv-main/x /tmp/mpv-dev/x -name 'libmpv-2.dll' | head -1)"
          MPV_IMPLIB="$(find /tmp/mpv-dev/x \( -name 'libmpv.dll.a' -o -name 'mpv.dll.a' \) | head -1)"
          MPV_CLIENT_H="$(find /tmp/mpv-dev/x -name 'client.h' -path '*mpv*' | head -1)"
          MPV_INCLUDE="$(dirname "$(dirname "$MPV_CLIENT_H")")"
          test -n "$MPV_DLL"
          test -n "$MPV_IMPLIB"
          test -n "$MPV_CLIENT_H"
          cp "$MPV_DLL" libs/libmpv/bin/
          cp -r "$MPV_INCLUDE" libs/libmpv/
          cp "$MPV_IMPLIB" libs/libmpv/lib/
          find libs/libmpv -maxdepth 3

      - name: Configure
        shell: bash
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake -B build \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build (Release)
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: cmake --build build --config Release --parallel

      # Hit-rate report: verify the cache actually pays off. Compiled
      # requests vs cache hits should approach ~100% on incremental pushes.
      - name: Show sccache stats
        shell: bash
        run: sccache --show-stats || true

      # 输出目录由根 CMakeLists.txt:16 CMAKE_RUNTIME_OUTPUT_DIRECTORY 统一定为
      # ${CMAKE_BINARY_DIR}/bin，VS 多配置生成器再追加 Release/ 子目录。
      # POST_BUILD 已自动执行 windeployqt + 拷贝 libmpv-2.dll，
      # build/bin/Release 即完整绿色包（exe + Qt DLL + 插件 + libmpv）。
      # 注意：不使用 CPack——install() 只装 exe + 自家 DLL，Qt DLL 不进 install 树，
      # CPack zip 无法独立运行。
      - name: Upload portable build
        uses: actions/upload-artifact@v5
        with:
          name: qEmby-windows-x64
          path: build/bin/Release/
          if-no-files-found: error

      # ===================== Releases 打包与发布 =====================
      # 产物与上游对齐（仅 Win64）：
      #   qEmby-<ver>-win-x64.zip         绿色便携版（解压即用）
      #   qEmby-<ver>-win-x64-Setup.exe   安装版（Inno Setup，runner 预装）
      # 发布策略：continuous 滚动 Release——每次 push 成功后覆盖更新同名
      # 资产，下载页始终是最新构建；版本号取自根 CMakeLists.txt project()。
      - name: Package portable zip
        shell: bash
        run: |
          set -euxo pipefail
          VER="$(sed -n 's/^project(qEmby VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -1)"
          test -n "$VER"
          mkdir -p dist
          7z a -tzip "dist/qEmby-${VER}-win-x64.zip" ./build/bin/Release/*
          echo "QEMBY_VERSION=${VER}" >> "$GITHUB_ENV"

      - name: Build installer (Inno Setup)
        shell: bash
        # MSYS2 会把以 /D 开头的参数当 POSIX 路径转换（如 /DAppVersion=0.0.7），
        # 导致 ISCC 报 "You may not specify more than one script filename"。
        env:
          MSYS2_ARG_CONV_EXCL: "/D"
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euxo pipefail
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          test -x "$ISCC"
          "$ISCC" \
            /DSrcDir="$(cygpath -w "$(pwd)/build/bin/Release")" \
            /DOutDir="$(cygpath -w "$(pwd)/dist")" \
            /DAppVersion="${QEMBY_VERSION}" \
            packaging/windows/qEmby.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: qEmby-windows-x64-Setup
          path: dist/*-Setup.exe
          if-no-files-found: error

      # 注意：上游已从 softprops/action-ghrelease 改名为 action-gh-release（加连字符），
      # 改名后 Actions 解析服务不重定向旧名，会报 repository not found。
      # v2.6.2 为最终 v2（Node 20 已弃用），升级到 v3（Node 24）。
      - name: Release (continuous)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: continuous
          name: "qEmby Win64 持续构建"
          prerelease: true
          body: |
            自动构建：commit ${{ github.sha }}（${{ github.event.head_commit.timestamp }}）

            最新提交：${{ github.event.head_commit.message }}

            | 文件 | 说明 |
            |---|---|
            | qEmby-*-win-x64.zip | 便携版（解压即用） |
            | qEmby-*-win-x64-Setup.exe | 安装版（含开始菜单/桌面快捷方式） |
          files: |
            dist/qEmby-*-win-x64.zip
            dist/qEmby-*-win-x64-Setup.exe

  # macOS 构建暂时禁用：macos-latest runner 曾卡 2h+ 不出结果（brew/dylibbundler
  # 慢 + arm64 runner 排队）。恢复方法：删除下行 `if: false`。
  build-macos:
    if: false # disabled: runner hangs for hours; Windows-only for now
    runs-on: macos-latest # arm64 runner
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          modules: qtwebsockets
          cache: true

      - name: Install libmpv & deployment tools
        run: |
          brew install mpv dylibbundler

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build --parallel

      # app bundle 由根 CMakeLists.txt:16 CMAKE_RUNTIME_OUTPUT_DIRECTORY 落在
      # build/bin/qEmbyApp.app（单配置生成器无 Release 子目录）
      - name: Bundle Qt frameworks (macdeployqt)
        run: |
          "$QT_ROOT_DIR/bin/macdeployqt" build/bin/qEmbyApp.app

      # macdeployqt 只收 Qt 库; libmpv 及其 brew 依赖链（ffmpeg 等）由
      # dylibbundler 递归收进 Contents/Frameworks 并修正 install_name
      - name: Bundle libmpv & brew deps (dylibbundler)
        run: |
          dylibbundler -b \
            -x build/bin/qEmbyApp.app/Contents/MacOS/qEmbyApp \
            -d build/bin/qEmbyApp.app/Contents/Frameworks \
            -p @executable_path/../Frameworks \
            --overwrite-files

      # arm64 上未签名 bundle 无法运行，ad-hoc 签名即可
      - name: Ad-hoc codesign
        run: |
          codesign --force --deep --sign - build/bin/qEmbyApp.app

      - name: Zip app bundle
        run: |
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent qEmbyApp.app qEmbyApp-macos-arm64.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v5
        with:
          name: qEmby-macos-arm64
          path: build/bin/qEmbyApp-macos-arm64.zip
          if-no-files-found: error
